<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' data: blob:; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>三星蔥工具箱</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#3a2b23">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="三星蔥工具箱">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar" hidden>
  <button id="homeBtn" aria-label="回首頁" title="回首頁"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5h3v5H18V9.5"/></svg></button>
  <button id="backBtn" aria-label="返回"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
  <select id="siteSelect" aria-label="選擇專案"></select>
  <button id="addSiteBtn" aria-label="新增專案"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  <button id="setBtn" aria-label="專案與公司設定"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5l4 4L9 19H5v-4z"/><path d="M12.5 7.5l4 4"/></svg></button>
</header>
<div id="backupWarn" hidden></div>
<div id="iab" hidden></div>
<main id="view"></main>
<footer id="copyright">© 2026 衡矩建築師事務所｜如需轉載或引用，敬請事先洽詢。</footer>
<div id="cam" hidden>
  <div id="camTitle"></div>
  <video id="camV" autoplay playsinline muted></video>
  <div class="camBar"><span id="camCount"></span><button type="button" id="camShot" aria-label="拍照"></button><button type="button" id="camDone">完成</button></div>
</div>
<div id="lb" hidden>
  <button type="button" id="lbClose" aria-label="關閉預覽">✕</button>
  <div id="lbCount"></div>
  <img id="lbImg" alt="照片預覽">
  <button type="button" id="lbPrev" aria-label="上一張">‹</button>
  <button type="button" id="lbNext" aria-label="下一張">›</button>
</div>
<dialog id="camErr">
  <p id="camErrMsg" style="margin:0 0 14px;line-height:1.6"></p>
  <label class="phbtn" style="width:100%;justify-content:center;margin-bottom:8px">📷 改用手機相機拍照<input type="file" id="camFb" accept="image/*" capture="environment" hidden></label>
  <button type="button" class="sec full" id="camErrClose">關閉</button>
</dialog>
<dialog id="setup">
  <form method="dialog" id="setupForm">
    <h2 id="setupTitle" style="margin:0 0 6px;font-size:20px">開始使用：先填寫專案</h2>
    <p id="setupHint" style="margin:0 0 12px;font-size:13px;color:var(--mut)">專案名稱會印在每張檢查表的「工程名稱」，請先填好再開始填表。之後可以按上方 ✎ 修改，或按 ＋ 新增其他工地。</p>
    <div class="field" style="margin:0 0 10px"><label>專案名稱（必填）</label><input id="sName" placeholder="例如：宜蘭三星蔥新建工程" required></div>
    <div class="field" style="margin:0 0 14px"><label>公司名稱（這個專案各表單最上方的抬頭，可空白）</label><input id="sCompany" placeholder="例如：○○營造有限公司"></div>
    <button class="full" id="sOk">開始填表</button>
    <button type="button" class="sec full" id="sCancel" style="margin-top:8px" hidden>取消</button>
    <button type="button" class="danger full" id="sDel" style="margin-top:8px" hidden>🗑 刪除這個專案</button>
  </form>
</dialog>
<script src="safe.js"></script>
<script src="icons.js"></script>
<script src="templates.js"></script>
<script src="attach.js"></script>
<script src="calc.js"></script>
<script src="volume.js"></script>
<script src="tile.js"></script>
<script src="tiledraw.js"></script>
<script src="colform.js"></script>
<script src="wallform.js"></script>
<script src="slabform.js"></script>
<script src="beamform.js"></script>
<script src="scaffold.js"></script>
<script src="bracket.js"></script>
<script src="rowframe.js"></script>
<script src="anchor.js"></script>
<script src="secprop.js"></script>
<script src="calcsave.js"></script>
<script src="calcsig.js"></script>
<script src="workorder.js"></script>
<script src="punch.js"></script>
<script src="pour.js"></script>
<script src="material.js"></script>
<script src="shot.js"></script>
<script src="cure.js"></script>
<script src="safety.js"></script>
<script src="log.js"></script>
<script src="savestat.js"></script>
<script src="app.js"></script>
<script src="cloud.js"></script>
<script src="cfstep.js"></script>
<script src="calcbar.js"></script>
<script src="sidenav.js"></script>
<script src="pdf.js"></script>
</body>
</html>
